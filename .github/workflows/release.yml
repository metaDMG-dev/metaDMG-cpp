name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing or new release tag to publish'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libbz2-dev \
            libcurl4-openssl-dev \
            libgsl-dev \
            liblzma-dev \
            samtools \
            zlib1g-dev

      - name: Build htslib
        run: |
          git clone --depth 1 --recursive https://github.com/samtools/htslib.git htslib
          make -C htslib

      - name: Build metaDMG-cpp
        run: make HTSSRC="$GITHUB_WORKSPACE/htslib"

      - name: Run test suite
        run: make test HTSSRC="$GITHUB_WORKSPACE/htslib"

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.release_tag || github.ref_name }}"
          package="metaDMG-cpp-${version}"
          mkdir -p "dist/${package}"
          cp metaDMG-cpp rank2level.txt README.md "dist/${package}/"
          cp misc/compressbam misc/extract_reads misc/sort_taxonomy_output "dist/${package}/"
          cp doc/formats.pdf doc/formats.tex "dist/${package}/"
          tar -czf "dist/${package}.tar.gz" -C dist "${package}"
          sha256sum "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
